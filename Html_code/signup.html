<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 
</head>

<body>
    <center>
        <form action="/form.php">
            <fieldset>
                <legend>Information</legend>


                <label for="firstname">First Name: </label>
                <input type="text" placeholder="Enter Your First Name" id="firstname">

                <br><br>

                <label for="lastname">Last Name:</label>
                <input type="text" placeholder="Enter Your Last Name" id="lastname">

                <br><br>

                <label for="email">Email</label>
                <input type="email" placeholder="Enter your email" id="email">



                <br><br>

                <label for="number">Number</label>
                <input type="tel" placeholder="Enter your number" id="number">


                <br>

                <div class="colors">
                    <h4>Select Your Gender</h4>
                    <label for="id1"> Male:

                        <input type="radio" id="id1" value="male" name="gender">
                    </label>
                    <label for="id2"> Female:

                        <input type="radio" id="id2" value="female" name="gender">
                    </label>



                    <p>Choose your sub</p>
                    <label for="10">Science</label>
                    <input type="checkbox" id="10" value="science">
                </div>



                <label for="20">Math</label>
                <input type="checkbox" id="20" value="math">

                <label for="30">Urdu</label>
                <input type="checkbox" id="30" value="urdu">



                <br><br>

                <label for="city">Choose your city</label>
                <select id="city">
                    <option value="Karachi">Karchi</option>
                    <option value="islamabad">Islamabad</option>
                    <option value="lahore">lahore</option>

                </select>



                <br>
                <br>
                <textarea placeholder="give your feedback"></textarea>


                <br><br>
                <input type="submit">

            </fieldset>


        </form>



    </center>




</body>

</html>
